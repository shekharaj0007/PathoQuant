[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathoquant"
version = "0.1.0"
description = "Gigapixel-aware nuclei segmentation and quantification"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "Pillow>=10.2",
  "scikit-image>=0.22",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
